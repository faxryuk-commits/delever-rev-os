[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install --include=dev && npm run build"

[deploy]
startCommand = "cd backend && npx prisma migrate resolve --rolled-back 20260212000000_init 2>/dev/null; npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
