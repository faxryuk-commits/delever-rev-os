[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install --include=dev && npm run build"

[deploy]
startCommand = "cd backend && npx prisma db push --skip-generate && (npx tsx prisma/seed.ts || echo 'Seed skipped') && node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
